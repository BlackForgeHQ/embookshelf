name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: go-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Read from the Makefile rather than restated here: "keep in sync"
      # is a comment, not a mechanism, and the same instruction in
      # CLAUDE.md drifted a minor version without anyone noticing (#187).
      # Older linter builds miscompile under newer Go toolchains (e.g.
      # staticcheck under go1.26 lost the t.Fatal noreturn fact, causing
      # false SA5011), so the version matters. Bump on release cadence —
      # in the Makefile, and everything follows.
      - id: golangci-version
        run: echo "version=$(make -s print-golangci-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci-version.outputs.version }}
          args: --timeout=5m

      # actionlint's bundled metadata for actions/create-github-app-token
      # is stale: it reports `app-id` as required and `client-id` as
      # undefined, but the action's own action.yml declares both, each
      # `required: false` — authenticating by Client ID is supported and
      # is what release-please.yml does. Verified against the action
      # repository rather than taken on faith, because the alternative
      # "fix" is editing live release credentials to satisfy a linter.
      #
      # Scoped to the one action so every other input mistake still
      # fails the job.
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          # Unquoted: the action splits flags with a regex that keeps
          # quotes in the token, so a quoted value reaches actionlint as
          # part of the pattern and matches nothing.
          flags: -ignore create-github-app-token

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    # The embedded-bundle tests (#330's nosniff sweep) fail rather than
    # skip when internal/staticfs/dist is empty — deliberately, so "the
    # bundle did not build" cannot read as green. That means go-test
    # needs the real bundle: ui-build's artifact, the same way
    # binary-smoke takes it.
    needs: ui-build
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: embookshelf
          POSTGRES_PASSWORD: embookshelf
          POSTGRES_DB: embookshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embookshelf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://embookshelf:embookshelf@localhost:5432/embookshelf?sslmode=disable
      # The S3 arm of the storage conformance suite reads this and skips
      # when it is unset — which is how it went unrun for its whole life
      # (#227). Set here, it runs as part of `go test ./...`.
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: embookshelf-test
      TEST_S3_AK: embookshelf
      TEST_S3_SK: embookshelf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Not a `services:` entry like postgres above, because GitHub's
      # service containers cannot supply a command and `minio` without
      # its `server` subcommand prints help and exits. Via the Makefile
      # target rather than compose directly, so CI and `make test-s3`
      # bring the store up one way instead of two that drift.
      - name: Start object store
        run: make s3-up

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: internal/staticfs/dist

      - run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  go-build:
    name: go-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Create the embed target so //go:embed in internal/staticfs/staticfs.go
      # doesn't error before ui-build has run.
      - run: mkdir -p internal/staticfs/dist && touch internal/staticfs/dist/.gitkeep

      - run: go build -o /dev/null ./...

  # The converter extension (ADR-0033) is a Rust crate; nothing else in
  # CI touches Rust, so the job carries its own toolchain and cache.
  # Scoped to changes under extensions/converter via a cheap diff check
  # rather than workflow-level `paths`, which would skip the whole
  # workflow's other jobs or need a second workflow to drift.
  converter:
    name: converter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/converter
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/converter

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

  ui-lint:
    name: ui-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      - run: bun run lint
        working-directory: ui

  ui-typecheck:
    name: ui-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      - run: bun run typecheck
        working-directory: ui

  ui-test:
    name: ui-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      # `vitest run` exits 1 when there are no specs; --passWithNoTests
      # keeps the job green until the first suite lands.
      - run: bunx vitest run --passWithNoTests
        working-directory: ui

  ui-build:
    name: ui-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      - name: Create staticfs target
        # sync-dist.ts writes to ../internal/staticfs/dist; ensure the
        # parent exists before `bun run build` runs it.
        run: mkdir -p internal/staticfs/dist

      - run: bun run build
        working-directory: ui

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: internal/staticfs/dist
          if-no-files-found: error
          retention-days: 1

  binary-smoke:
    name: binary-smoke
    runs-on: ubuntu-latest
    needs: ui-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: internal/staticfs/dist

      - name: Build binary
        run: go build -o ./tmp/embookshelf ./cmd/embookshelf

      - name: Verify binary is executable
        run: test -x ./tmp/embookshelf && file ./tmp/embookshelf

  migrations-sanity:
    name: migrations-sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: embookshelf
          POSTGRES_PASSWORD: embookshelf
          POSTGRES_DB: embookshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embookshelf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://embookshelf:embookshelf@localhost:5432/embookshelf?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: migrate up
        run: go run ./cmd/migrate up

      - name: migrate down (to version 0)
        # Drive the down path to completion so reversibility is exercised
        # in CI. `migrate down` without -all reverts the most recent
        # migration; loop until version reports 0 / "no migration".
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            if ! go run ./cmd/migrate down 2>&1 | tee /tmp/migrate-down.log; then
              echo "migrate down failed"
              exit 1
            fi
            if grep -qi "no migration" /tmp/migrate-down.log; then
              echo "down complete"
              break
            fi
          done

      - name: migrate up (again — ensures a clean re-apply)
        run: go run ./cmd/migrate up

  # SQLite is no longer a supported runtime backend (ADR-0023), but the
  # SQLite migration tree survives to serve `embookshelf import-sqlite`,
  # which brings an old source database forward before reading it. This
  # job keeps that tree applying cleanly. Retire it with the importer.
  #
  # Only `up` is exercised: the importer never migrates a source
  # backwards, and the tree's down migrations use
  # `ALTER TABLE ... DROP COLUMN IF EXISTS`, which SQLite does not
  # support. Reversibility of a frozen, importer-only tree has no
  # consumer.
  migrations-sanity-sqlite-importer:
    name: migrations-sanity-sqlite-importer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite://./data/embookshelf.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Create data directory
        run: mkdir -p ./data

      - name: migrate up
        run: go run ./cmd/migrate up

      - name: migrate up again (idempotent re-apply)
        run: go run ./cmd/migrate up
