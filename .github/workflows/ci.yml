name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: go-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # v2.1.x is built against Go 1.24 and refuses to run against
          # the Go 1.25 toolchain declared in go.mod. v2.11.x uses
          # Go 1.25+. Bump on release cadence.
          version: v2.11.4
          args: --timeout=5m

      - name: actionlint
        uses: raven-actions/actionlint@v2

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  go-build:
    name: go-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Create the embed target so //go:embed in internal/staticfs/staticfs.go
      # doesn't error before ui-build has run.
      - run: mkdir -p internal/staticfs/dist && touch internal/staticfs/dist/.gitkeep

      - run: go build -o /dev/null ./...

  ui-lint:
    name: ui-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      - run: bun run lint
        working-directory: ui

  ui-typecheck:
    name: ui-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      - run: bun run typecheck
        working-directory: ui

  ui-test:
    name: ui-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      # `vitest run` exits 1 when there are no specs; --passWithNoTests
      # keeps the job green until the first suite lands.
      - run: bunx vitest run --passWithNoTests
        working-directory: ui

  ui-build:
    name: ui-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        working-directory: ui

      - name: Create staticfs target
        # sync-dist.ts writes to ../internal/staticfs/dist; ensure the
        # parent exists before `bun run build` runs it.
        run: mkdir -p internal/staticfs/dist

      - run: bun run build
        working-directory: ui

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: internal/staticfs/dist
          if-no-files-found: error
          retention-days: 1

  binary-smoke:
    name: binary-smoke
    runs-on: ubuntu-latest
    needs: ui-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: internal/staticfs/dist

      - name: Build binary
        run: go build -o ./tmp/embookshelf ./cmd/embookshelf

      - name: Verify binary is executable
        run: test -x ./tmp/embookshelf && file ./tmp/embookshelf

  migrations-sanity:
    name: migrations-sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: embookshelf
          POSTGRES_PASSWORD: embookshelf
          POSTGRES_DB: embookshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embookshelf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://embookshelf:embookshelf@localhost:5432/embookshelf?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: migrate up
        run: go run ./cmd/migrate up

      - name: migrate down (to version 0)
        # Drive the down path to completion so reversibility is exercised
        # in CI. `migrate down` without -all reverts the most recent
        # migration; loop until version reports 0 / "no migration".
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            if ! go run ./cmd/migrate down 2>&1 | tee /tmp/migrate-down.log; then
              if grep -qi "no migration" /tmp/migrate-down.log; then
                echo "down complete"
                break
              fi
              echo "migrate down failed"
              exit 1
            fi
          done

      - name: migrate up (again — ensures a clean re-apply)
        run: go run ./cmd/migrate up
