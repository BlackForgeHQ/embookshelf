name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # Tag pushes produce a uniquely-named artifact — never cancel mid-publish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create releases on tag push
      packages: write        # push to GHCR
      id-token: write        # SLSA provenance
      attestations: write    # SLSA provenance attestation
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=embookshelf
            org.opencontainers.image.description=Self-hosted, multi-user digital library
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Generate SPDX SBOM (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output-file: embookshelf_${{ github.ref_name }}_spdx.json
          upload-artifact: false

      # release-please creates the GitHub Release when its PR merges; we
      # attach the SBOM to that existing Release. If release-please's
      # Release hasn't propagated yet (webhook ordering), retry briefly.
      # If a tag was pushed manually (release-please bypassed), create
      # the Release ourselves with auto-generated notes as a fallback.
      - name: Attach SBOM to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SBOM_FILE: embookshelf_${{ github.ref_name }}_spdx.json
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$SBOM_FILE" --clobber
              exit 0
            fi
            echo "waiting for release $GITHUB_REF_NAME (attempt $i/6)"
            sleep 10
          done
          echo "release $GITHUB_REF_NAME not found after 60s; creating"
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" "$SBOM_FILE" \
              --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "$SBOM_FILE" \
              --generate-notes
          fi
