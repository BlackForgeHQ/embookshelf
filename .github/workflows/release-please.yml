name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write         # create commits, tags, releases
  pull-requests: write    # open / update the release PR

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PAT (or GitHub App token) is required so the tag push that
          # release-please performs fires downstream workflows
          # (image.yml). Tags pushed with the default GITHUB_TOKEN are
          # silenced by GitHub's anti-recursion rule, so image builds
          # for new versions never start. Falls back to GITHUB_TOKEN if
          # the secret is unset, which keeps release-please functional
          # but again skips the tag-triggered image build.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
