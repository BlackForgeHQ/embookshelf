<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>embookshelf</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script>
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "layout": "grid",
    "readerFont": "JetBrains Mono",
    "readerSize": 20,
    "readerLine": 1.65
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components/Cover.jsx"></script>
<script type="text/babel" src="components/Sidebar.jsx"></script>
<script type="text/babel" src="components/TopBar.jsx"></script>
<script type="text/babel" src="components/LibraryView.jsx"></script>
<script type="text/babel" src="components/BookDetail.jsx"></script>
<script type="text/babel" src="components/Reader.jsx"></script>
<script type="text/babel" src="components/Dashboard.jsx"></script>
<script type="text/babel" src="components/BookDrop.jsx"></script>
<script type="text/babel" src="components/MetadataEditor.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  // Persistent view state
  const [view, setView] = useState(() => localStorage.getItem('ebs_view') || 'dashboard');
  const [bookId, setBookId] = useState(() => localStorage.getItem('ebs_bookId') || 'b1');
  const [activeLibrary, setActiveLibrary] = useState('main');
  const [activeShelf, setActiveShelf] = useState(null);

  // Tweaks
  const [layout, setLayout] = useState(TWEAKS.layout);
  const [readerFont, setReaderFont] = useState(TWEAKS.readerFont);
  const [readerSize, setReaderSize] = useState(TWEAKS.readerSize);
  const [readerLine, setReaderLine] = useState(TWEAKS.readerLine);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => { localStorage.setItem('ebs_view', view); }, [view]);
  useEffect(() => { localStorage.setItem('ebs_bookId', bookId); }, [bookId]);

  // Tweaks protocol
  useEffect(() => {
    function handler(e) {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const persist = (edits) => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  };

  const openBook = (id) => { setBookId(id); setView('detail'); };
  const readBook = (id) => { setBookId(id); setView('reader'); };
  const editBook = (id) => { setBookId(id); setView('metadata'); };

  const fontMap = {
    'Spectral': 'Spectral, Georgia, serif',
    'Georgia': 'Georgia, Times, serif',
    'JetBrains Mono': 'JetBrains Mono, ui-monospace, monospace',
    'System Sans': '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
  };

  // Reader is a full-screen takeover
  if (view === 'reader') {
    return <>
      <Reader bookId={bookId} onExit={() => setView('detail')}
        readerFont={fontMap[readerFont]} readerSize={readerSize} readerLine={readerLine} />
      {tweaksOpen && <TweaksPanel
        layout={layout} setLayout={(v) => { setLayout(v); persist({ layout: v }); }}
        readerFont={readerFont} setReaderFont={(v) => { setReaderFont(v); persist({ readerFont: v }); }}
        readerSize={readerSize} setReaderSize={(v) => { setReaderSize(v); persist({ readerSize: v }); }}
        readerLine={readerLine} setReaderLine={(v) => { setReaderLine(v); persist({ readerLine: v }); }} />}
    </>;
  }

  return (
    <div className="app" data-screen-label={view}>
      <Sidebar
        view={view} setView={setView}
        activeLibrary={activeLibrary} setActiveLibrary={setActiveLibrary}
        activeShelf={activeShelf} setActiveShelf={setActiveShelf} />

      <main className="main">
        {view === 'dashboard' && <Dashboard onOpen={openBook} />}
        {view === 'library' && <LibraryView layout={layout} setLayout={(v) => { setLayout(v); persist({ layout: v }); }} onOpen={openBook} activeShelf={activeShelf} />}
        {view === 'detail' && <BookDetail bookId={bookId} onBack={() => setView('library')} onRead={readBook} onEdit={editBook} />}
        {view === 'metadata' && <MetadataEditor bookId={bookId} onBack={() => setView('detail')} />}
        {view === 'bookdrop' && <BookDrop onBack={() => setView('dashboard')} />}
        {view === 'notebook' && <Notebook onOpen={openBook} />}
        {view === 'settings' && <Settings />}

        <div className="status-bar">
          <span className="status-dot green" />
          <span>embookshelf 1.4.2 · LOCAL mode</span>
          <span>·</span>
          <span>3 libraries · 1,202 volumes</span>
          <span>·</span>
          <span>MariaDB · connected</span>
          <div style={{ flex: 1 }} />
          <span>2 background tasks</span>
          <span>·</span>
          <span>⌘K to search</span>
        </div>
      </main>

      {tweaksOpen && <TweaksPanel
        layout={layout} setLayout={(v) => { setLayout(v); persist({ layout: v }); }}
        readerFont={readerFont} setReaderFont={(v) => { setReaderFont(v); persist({ readerFont: v }); }}
        readerSize={readerSize} setReaderSize={(v) => { setReaderSize(v); persist({ readerSize: v }); }}
        readerLine={readerLine} setReaderLine={(v) => { setReaderLine(v); persist({ readerLine: v }); }} />}
    </div>
  );
}

function TweaksPanel({ layout, setLayout, readerFont, setReaderFont, readerSize, setReaderSize, readerLine, setReaderLine }) {
  return (
    <div className="tweaks-panel">
      <header>
        <span style={{ fontFamily: 'Spectral, serif', fontWeight: 500, fontSize: 14, fontStyle: 'italic' }}>Tweaks</span>
        <span className="t-micro" style={{ fontSize: 9.5 }}>live</span>
      </header>
      <div className="tweaks-body">
        <div>
          <div className="t-label" style={{ marginBottom: 6 }}>Library layout</div>
          <div style={{ display: 'flex', gap: 4 }}>
            {['shelf','grid','list'].map(l => (
              <button key={l} onClick={() => setLayout(l)}
                className={`btn small ${layout === l ? 'primary' : ''}`}
                style={{ flex: 1, justifyContent: 'center', textTransform: 'capitalize' }}>
                {l}
              </button>
            ))}
          </div>
        </div>
        <div>
          <div className="t-label" style={{ marginBottom: 6 }}>Reader font</div>
          <select className="input" value={readerFont} onChange={e => setReaderFont(e.target.value)}>
            <option>Spectral</option>
            <option>Georgia</option>
            <option>System Sans</option>
            <option>JetBrains Mono</option>
          </select>
        </div>
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            <div className="t-label">Reader size</div>
            <span className="mono" style={{ fontSize: 10.5 }}>{readerSize}px</span>
          </div>
          <input type="range" min="14" max="26" value={readerSize} onChange={e => setReaderSize(+e.target.value)} style={{ width: '100%' }} />
        </div>
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            <div className="t-label">Line height</div>
            <span className="mono" style={{ fontSize: 10.5 }}>{readerLine.toFixed(2)}</span>
          </div>
          <input type="range" min="1.3" max="2.0" step="0.05" value={readerLine} onChange={e => setReaderLine(+e.target.value)} style={{ width: '100%' }} />
        </div>
      </div>
    </div>
  );
}

function Settings() {
  return (
    <div className="fade-in">
      <TopBar title="Settings" subtitle="Instance, users, metadata providers, sync." />
      <div style={{ padding: '28px 32px', display: 'grid', gridTemplateColumns: '220px 1fr', gap: 40, maxWidth: 900 }}>
        <nav style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {['Account','Reading preferences','Libraries','Metadata providers','Device sync','Email delivery','Users & roles','Backups','About'].map((x, i) => (
            <button key={x} style={{
              padding: '8px 12px', textAlign: 'left', background: i === 0 ? 'var(--paper-3)' : 'transparent',
              border: 'none', cursor: 'pointer', fontFamily: 'Spectral, serif', fontSize: 13.5,
              borderLeft: i === 0 ? '2px solid var(--accent)' : '2px solid transparent',
              color: i === 0 ? 'var(--ink-1)' : 'var(--ink-2)',
            }}>{x}</button>
          ))}
        </nav>
        <div style={{ maxWidth: 560 }}>
          <h2 className="t-h2" style={{ marginBottom: 24 }}>Account</h2>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: 16, border: '1px solid var(--rule-soft)', background: 'var(--paper-0)', marginBottom: 24 }}>
            <div style={{ width: 48, height: 48, borderRadius: '50%', background: 'var(--accent)', color: 'var(--paper-0)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Spectral, serif', fontSize: 18, fontWeight: 500 }}>RA</div>
            <div>
              <div style={{ fontSize: 15, fontWeight: 500 }}>Rowan Ashby</div>
              <div className="t-small" style={{ fontSize: 12 }}>rowan@home.local · Admin · joined Aug 2024</div>
            </div>
            <div style={{ flex: 1 }} />
            <button className="btn small">Change password</button>
          </div>
          <div className="t-label" style={{ marginBottom: 10 }}>Authentication</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 24 }}>
            {[
              { n: 'Local (JWT)', on: true, sub: 'Username + password' },
              { n: 'OIDC', on: true, sub: 'authentik.home.local' },
              { n: 'Remote / Forward Auth', on: false, sub: 'Reverse proxy headers' },
            ].map(a => (
              <div key={a.n} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '10px 14px', border: '1px solid var(--rule-soft)', background: 'var(--paper-0)' }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: a.on ? 'oklch(0.58 0.12 140)' : 'var(--ink-4)' }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 500 }}>{a.n}</div>
                  <div className="t-small" style={{ fontSize: 11.5 }}>{a.sub}</div>
                </div>
                <span className="t-micro">{a.on ? 'enabled' : 'disabled'}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
