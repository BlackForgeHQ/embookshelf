version: "2"
sql:
  - engine: postgresql
    queries: internal/repo/queries
    schema: migrations
    gen:
      go:
        package: generated
        out: internal/repo/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
