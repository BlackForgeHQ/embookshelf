services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: embookshelf
      POSTGRES_PASSWORD: embookshelf
      POSTGRES_DB: embookshelf
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - embookshelf_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embookshelf"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: golang:1.26-alpine
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /src
    volumes:
      - .:/src
    environment:
      GOMODCACHE: /go/pkg/mod
      DATABASE_URL: postgres://embookshelf:embookshelf@postgres:5432/embookshelf?sslmode=disable
    command: ["go", "run", "./cmd/migrate", "up"]

  # MinIO is the object store the storage conformance suite's S3 arm runs
  # against — locally via `make test-s3`, and in CI, which starts this
  # same service rather than restating one in a `services:` block
  # (GitHub's service containers cannot pass a command, and `minio` with
  # no `server` subcommand prints help and exits).
  #
  # Pinned to a release tag: MinIO publishes no semver stream, only
  # `latest` and dated RELEASE.* tags, and an object store that changes
  # under CI without a commit is exactly the flake this suite exists to
  # rule out. Bump deliberately.
  #
  # No bucket is provisioned here: the test creates its own on first run,
  # so pointing TEST_S3_ENDPOINT at any object store is enough. What the
  # test cannot do for itself is switch versioning on — that is a
  # property of the bucket, and without it the conformance suite's
  # CapVersioning row asserts nothing (#270). `make s3-up` provisions it,
  # and CI calls that target rather than starting this service directly.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: embookshelf
      MINIO_ROOT_PASSWORD: embookshelf
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - embookshelf_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The converter extension (ADR-0033): Rust sidecar wrapping anydoc.
  # Optional — embookshelf runs without it, and conversion-dependent
  # features report "extension not configured". Point the CONVERTER
  # admin setting at http://localhost:6070. Started via `make
  # converter-up`, same convention as db-up / s3-up: `make up` runs only
  # backend + Vite.
  converter:
    build: ./extensions/converter
    restart: unless-stopped
    ports:
      - "6070:6070"
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
      # and the service binds IPv4 0.0.0.0 only.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:6070/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # grafana/otel-lgtm bundles an OTLP collector (OpenTelemetry Collector),
  # Loki (logs), Grafana Tempo (traces), Grafana Mimir (metrics), and a
  # pre-provisioned Grafana UI. Point the app at 4317 (gRPC) or 4318
  # (http/protobuf) via OTEL_EXPORTER_OTLP_ENDPOINT. Grafana UI lives on
  # :3001 to avoid clashing with the Vite dev server on :3000/:5173.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "3001:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - embookshelf_otel_lgtm:/data

volumes:
  embookshelf_pg:
  embookshelf_minio:
  embookshelf_otel_lgtm:
