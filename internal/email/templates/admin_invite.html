<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>You're invited to embookshelf</title></head>
<body style="font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#fafaf9;color:#1c1917;margin:0;padding:24px;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e7e5e4;border-radius:8px;">
    <tr><td style="padding:32px 32px 16px 32px;">
      <h1 style="margin:0 0 16px 0;font-size:20px;color:#1c1917;">You're invited to embookshelf</h1>
      <p style="margin:0 0 16px 0;line-height:1.5;">{{.InvitedByName}} invited you to join their embookshelf instance as a <strong>{{.Role}}</strong>.</p>
      <p style="margin:24px 0;">
        <a href="{{.AcceptURL}}" style="display:inline-block;background:#1c1917;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:600;">Accept invitation</a>
      </p>
      <p style="margin:0 0 16px 0;line-height:1.5;color:#57534e;font-size:14px;">This link expires on {{.ExpiresAt}}.</p>
      <p style="margin:24px 0 0 0;line-height:1.5;color:#a8a29e;font-size:12px;word-break:break-all;">If the button does not work, paste this URL into your browser:<br>{{.AcceptURL}}</p>
    </td></tr>
  </table>
</body>
</html>
