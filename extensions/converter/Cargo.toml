[package]
name = "embookshelf-converter"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "embookshelf converter extension: document bytes in, GitHub-Flavored Markdown out (ADR-0033)"
publish = false

[dependencies]
anydoc = "0.1"
axum = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
zip = { version = "4", features = ["deflate"] }
